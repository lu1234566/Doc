<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatura → Sage 50 · v0.6.7-alpha1</title>
<style>
html,body{height:100%;margin:0;background:#0f172a;color:#e7edf7;font-family:Segoe UI,Arial,sans-serif}
.w{height:100%;display:grid;place-items:center}.b{max-width:620px;padding:28px;text-align:center}
.s{width:40px;height:40px;border:4px solid #334155;border-top-color:#7aa2ff;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;text-align:left;background:#111827;padding:12px;border-radius:10px;color:#ff9289}
</style>
</head>
<body>
<div class="w"><div class="b"><div class="s"></div><h2>A carregar Fatura → Sage 50…</h2><small>v0.6.7-alpha1 · preview de teste</small><pre id="e" hidden></pre></div></div>
<script>
(async()=>{
 try{
  const r=await fetch('/fatura-app.gz.b64',{cache:'no-store'});
  if(!r.ok)throw new Error('Falha ao carregar pacote: HTTP '+r.status);
  const b64=(await r.text()).trim(),x=atob(b64),a=new Uint8Array(x.length);
  for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Use Chrome ou Edge atualizado.');
  let h=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  h=h.replace(/v0\.6\.6\.1/g,'v0.6.7-alpha1').replace(/v0\.6\.6\.2/g,'v0.6.7-alpha1');
  const quick='<a href="/manual.html" style="position:fixed;right:16px;bottom:16px;z-index:99999;background:#f6c85f;color:#201700;padding:11px 14px;border-radius:999px;font:700 13px Segoe UI,Arial;text-decoration:none;box-shadow:0 8px 28px #0008">Consulta manual · António Pedro</a>';
  h=h.replace('</body>',quick+'</body>');
  document.open();document.write(h);document.close();
 }catch(e){
  document.querySelector('.s').style.display='none';
  document.querySelector('h2').textContent='Falha ao iniciar';
  const p=document.getElementById('e');p.hidden=false;p.textContent=String(e.message||e);
 }
})();
</script>
</body></html>
