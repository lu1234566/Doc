<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta Manual · Fatura → Sage 50</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#111827;--panel2:#182235;--line:#334155;--text:#e7edf7;--muted:#94a3b8;--blue:#4f7cff;--green:#65d690;--amber:#f6c85f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b1220;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:800}.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--amber);color:#201700;font-weight:800}
main{max-width:1050px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:22px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input{flex:1;min-width:260px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:16px}
button{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}.count{padding:10px 12px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}
.tableWrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:#182235;font-size:12px;color:#cbd5e1}td:first-child{font-family:Consolas,monospace;font-weight:800}
.copy{white-space:nowrap}.ok{color:var(--green)}.err{color:#ff9289}.note{margin-top:12px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="brand">Fatura → Sage 50 · Consulta manual</div><span class="badge">v0.6.7-alpha1 TESTE</span></header>
<main><div class="card">
<h1>Artigos · ANTÓNIO PEDRO</h1>
<div class="muted">Pesquisa rápida por artigo ou referência para lançamento manual.</div>
<div class="tools"><input id="q" autofocus placeholder="Ex.: maçã golden, tomate rama, 0013279"><button id="clear">Limpar</button><span id="count" class="count">A carregar…</span></div>
<div class="tableWrap"><table><thead><tr><th>Referência</th><th>Artigo</th><th>Fornecedor</th><th></th></tr></thead><tbody id="body"><tr><td colspan="4">A carregar base…</td></tr></tbody></table></div>
<div class="note">Base transcrita das fotografias enviadas. Esta página é apenas consulta; não escreve no Sage.</div>
</div></main>
<script>
let rows=[];
const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 const q=norm(document.querySelector("#q").value), t=q.split(/\s+/).filter(Boolean);
 const f=rows.filter(r=>{const h=norm(r.reference+" "+r.description+" "+r.supplier);return t.every(x=>h.includes(x))});
 document.querySelector("#count").textContent=f.length+" artigo"+(f.length===1?"":"s");
 document.querySelector("#body").innerHTML=f.map(r=>'<tr><td>'+esc(r.reference)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.supplier)+'</td><td><button class="copy" data-r="'+esc(r.reference)+'">Copiar ref.</button></td></tr>').join("")||'<tr><td colspan="4">Nenhum artigo encontrado.</td></tr>';
 document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.r);const x=b.textContent;b.textContent="Copiado";b.classList.add("ok");setTimeout(()=>{b.textContent=x;b.classList.remove("ok")},900)}catch{prompt("Copie a referência:",b.dataset.r)}})
}
document.querySelector("#q").addEventListener("input",render);
document.querySelector("#clear").onclick=()=>{document.querySelector("#q").value="";render();document.querySelector("#q").focus()};
fetch("/manual-articles.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(x=>{rows=x;render()}).catch(e=>{document.querySelector("#count").textContent="Erro";document.querySelector("#body").innerHTML='<tr><td colspan="4" class="err">Falha ao carregar a base: '+esc(e.message)+'</td></tr>'});
</script>
</body></html>
